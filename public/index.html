<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood tracker</title>

    <!-- Generated by Tailwind: run `npm run watch:css` while developing -->
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="app.js"></script>
</head>

<body class="bg-slate-50 text-slate-800 antialiased">
    <main class="mx-auto max-w-2xl px-4 py-8">
        <h1 class="mb-6 text-2xl font-semibold tracking-tight">Mood tracker</h1>

        <div role="tablist" aria-label="Tracker" class="mb-6 inline-flex rounded-lg bg-slate-200/70 p-1 text-sm font-medium">
            <a href="#mood" role="tab" data-kind="mood" class="js-tab rounded-md px-4 py-1.5">Mood</a>
            <a href="#symptoms" role="tab" data-kind="symptom" class="js-tab rounded-md px-4 py-1.5">Symptoms</a>
        </div>

        <!-- One panel per tracker is created from the template below (see app.js) -->
        <div class="js-panels"></div>
    </main>

    <template id="tracker-template">
        <div role="tabpanel" class="js-panel">
            <!-- Log form -->
            <section class="mb-6 rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
                <h2 class="js-form-title mb-4 text-lg font-medium"></h2>

                <form class="js-entry-form space-y-5">
                    <div>
                        <label class="js-lookup-label mb-1.5 block text-sm font-medium text-slate-700"></label>
                        <div class="flex gap-2">
                            <select name="lookupId" required
                                    class="js-lookup-select min-w-0 flex-1 rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 focus:outline-none">
                                <option value="" disabled selected>Loading…</option>
                            </select>
                            <button type="button"
                                    class="js-new-toggle shrink-0 rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-600 hover:bg-slate-50"></button>
                        </div>

                        <div class="js-new-panel mt-2 flex gap-2" hidden>
                            <input maxlength="50"
                                   class="js-new-input min-w-0 flex-1 rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 focus:outline-none">
                            <button type="button"
                                    class="js-new-add rounded-lg bg-indigo-600 px-3 py-2 text-sm font-medium text-white hover:bg-indigo-700 disabled:opacity-50">
                                Add
                            </button>
                            <button type="button"
                                    class="js-new-cancel rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-600 hover:bg-slate-50">
                                Cancel
                            </button>
                        </div>
                        <p class="js-new-error mt-1.5 text-sm text-rose-600" hidden></p>
                    </div>

                    <fieldset>
                        <legend class="mb-1.5 text-sm font-medium text-slate-700">
                            <span class="js-score-legend"></span>
                            <span class="js-score-hint font-normal text-slate-500"></span>
                        </legend>
                        <div class="inline-flex overflow-hidden rounded-lg border border-slate-300 text-sm">
                            <label class="cursor-pointer border-r border-slate-300 px-3.5 py-2 text-slate-600 select-none hover:bg-slate-50 has-checked:bg-indigo-600 has-checked:text-white has-focus-visible:ring-2 has-focus-visible:ring-indigo-300 has-focus-visible:ring-inset">
                                <input type="radio" name="score" value="" class="sr-only" checked>–
                            </label>
                            <label class="cursor-pointer border-r border-slate-300 px-3.5 py-2 text-slate-600 select-none hover:bg-slate-50 has-checked:bg-indigo-600 has-checked:text-white has-focus-visible:ring-2 has-focus-visible:ring-indigo-300 has-focus-visible:ring-inset">
                                <input type="radio" name="score" value="1" class="sr-only">1
                            </label>
                            <label class="cursor-pointer border-r border-slate-300 px-3.5 py-2 text-slate-600 select-none hover:bg-slate-50 has-checked:bg-indigo-600 has-checked:text-white has-focus-visible:ring-2 has-focus-visible:ring-indigo-300 has-focus-visible:ring-inset">
                                <input type="radio" name="score" value="2" class="sr-only">2
                            </label>
                            <label class="cursor-pointer border-r border-slate-300 px-3.5 py-2 text-slate-600 select-none hover:bg-slate-50 has-checked:bg-indigo-600 has-checked:text-white has-focus-visible:ring-2 has-focus-visible:ring-indigo-300 has-focus-visible:ring-inset">
                                <input type="radio" name="score" value="3" class="sr-only">3
                            </label>
                            <label class="cursor-pointer border-r border-slate-300 px-3.5 py-2 text-slate-600 select-none hover:bg-slate-50 has-checked:bg-indigo-600 has-checked:text-white has-focus-visible:ring-2 has-focus-visible:ring-indigo-300 has-focus-visible:ring-inset">
                                <input type="radio" name="score" value="4" class="sr-only">4
                            </label>
                            <label class="cursor-pointer px-3.5 py-2 text-slate-600 select-none hover:bg-slate-50 has-checked:bg-indigo-600 has-checked:text-white has-focus-visible:ring-2 has-focus-visible:ring-indigo-300 has-focus-visible:ring-inset">
                                <input type="radio" name="score" value="5" class="sr-only">5
                            </label>
                        </div>
                    </fieldset>

                    <div>
                        <label class="js-trigger-label mb-1.5 block text-sm font-medium text-slate-700">
                            Trigger <span class="font-normal text-slate-500">(optional)</span>
                        </label>
                        <input name="trigger" maxlength="200" placeholder="What caused it?"
                               class="js-trigger-input w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 focus:outline-none">
                    </div>

                    <div class="js-form-error rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-700" role="alert" hidden></div>

                    <button type="submit"
                            class="js-submit rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700 disabled:opacity-50"></button>
                </form>
            </section>

            <!-- Recent entries -->
            <section class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
                <div class="flex items-center justify-between border-b border-slate-200 px-5 py-3">
                    <h2 class="js-list-title text-lg font-medium"></h2>
                    <span class="js-entry-count rounded-full bg-slate-100 px-2.5 py-0.5 text-xs font-medium text-slate-600"></span>
                </div>
                <div class="js-list-error m-4 rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-700" role="alert" hidden></div>
                <ul class="js-entry-list divide-y divide-slate-100">
                    <li class="px-5 py-4 text-sm text-slate-500">Loading…</li>
                </ul>
            </section>
        </div>
    </template>
</body>
</html>
